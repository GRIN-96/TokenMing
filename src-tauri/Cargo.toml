[package]
name = "tokenming"
version = "0.1.3"
description = "Claude Code token usage widget"
authors = ["you"]
edition = "2021"

[lib]
name = "tokenming_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tokenming"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
keyring = "2"
dirs = "5"
anyhow = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-registry = "0.1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
