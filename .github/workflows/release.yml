name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "TokenMing ${{ github.ref_name }}"
          releaseBody: |
            ## TokenMing 위젯

            Claude Code 토큰 사용량 데스크탑 위젯.

            ### 다운로드
            - **Windows**: `.msi` 또는 `.exe` (NSIS)
            - **macOS**: `.dmg` (Intel + Apple Silicon 통합)

            ### macOS 설치
            Apple Developer 서명이 없는 ad-hoc 빌드라 첫 실행 시 한 번만 아래 절차가 필요합니다.

            1. dmg를 열어 `TokenMing.app`을 `Applications`로 드래그
            2. 터미널에서 quarantine 속성 제거:
               ```bash
               xattr -cr /Applications/TokenMing.app
               ```
            3. Applications에서 앱 실행 (이후로는 일반 앱처럼 동작)

            > "손상되었기 때문에 열 수 없습니다" 메시지가 뜨면 2번 명령을 실행하지 않은 것입니다.

            ### Windows 설치
            SmartScreen 경고 시 **"추가 정보 → 실행"** 클릭.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
